[workspace]
members = ["ca-rules2", "egui", "lib", "tui"]
resolver = "2"

[workspace.dependencies]
ca-rules2 = { path = "ca-rules2", version = "0.1.0" }
clap = { version = "4.6.1", features = ["derive"] }
color-eyre = "0.6.5"
documented = "0.9.2"
eframe = { version = "0.34.3", default-features = false, features = [
    "default_fonts",
    "glow",
] }
egui = "0.34.3"
factoriosrc-lib = { path = "lib", version = "0.1.0" }
log = "0.4.30"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
