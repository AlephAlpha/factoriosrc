[workspace]
members = ["ca-rules2", "egui", "lib", "symmetry", "tui"]
resolver = "2"

[workspace.dependencies]
base64 = "0.23.1"
ca-rules2 = { path = "ca-rules2", version = "0.1.0" }
ca-symmetry = { path = "symmetry", version = "0.1.0" }
clap = { version = "4.6.6", features = ["derive"] }
color-eyre = "0.6.5"
documented = "0.10.0"
eframe = { version = "0.36.1", default-features = false, features = [
    "default_fonts",
    "glow",
] }
egui = "0.36.1"
factoriosrc-lib = { path = "lib", version = "0.1.0" }
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
