[workspace]
members = ["ca-rules2", "egui", "lib", "tui"]
resolver = "2"

[workspace.dependencies]
ca-rules2 = { path = "ca-rules2", version = "0.1.0" }
clap = { version = "4.6.4", features = ["derive"] }
color-eyre = "0.6.5"
documented = "0.10.0"
eframe = { version = "0.35.0", default-features = false, features = [
    "default_fonts",
    "glow",
] }
egui = "0.35.0"
factoriosrc-lib = { path = "lib", version = "0.1.0" }
log = "0.4.33"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
