[package]
name = "factoriosrc-egui"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
documented = { workspace = true }
eframe = { workspace = true, features = ["x11"] }
env_logger = "0.11.11"
egui = { workspace = true }
factoriosrc-lib = { workspace = true, features = ["documented"] }
log = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
web-time = "1.1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { version = "0.17.2", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Enables the `wasm_js` backend of both `getrandom` versions in the
# dependency graph; without it, the `wasm32-unknown-unknown` build fails.
getrandom_0_3 = { package = "getrandom", version = "0.3.4", features = [
    "wasm_js",
] }
getrandom = { version = "0.4.3", features = ["wasm_js"] }
js-sys = "0.3.105"
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.78"
web-sys = { version = "0.3.105", features = [
    "Blob",
    "DedicatedWorkerGlobalScope",
    "Document",
    "Element",
    "Event",
    "File",
    "FileList",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "HtmlInputElement",
    "MessageEvent",
    "Url",
    "Window",
    "Worker",
    "WorkerGlobalScope",
    "WorkerOptions",
    "WorkerType",
] }

[features]
save = ["dep:rfd", "dep:serde", "dep:serde_json", "factoriosrc-lib/serde"]
default = ["save"]
