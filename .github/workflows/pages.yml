name: Github Pages

# Deploy the web UI to GitHub Pages on every push to `main`.
on:
  push:
    branches:
      - main

permissions:
  contents: write # for committing to the gh-pages branch

jobs:
  build-github-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Download and install Trunk
        run: wget -qO- https://github.com/thedodd/trunk/releases/latest/download/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xzf-
      - name: Build
        # `--public-url` makes trunk rewrite asset paths for the project page
        # at `https://<owner>.github.io/<repo>/`.
        run: ../trunk build --release --public-url "$public_url"
        working-directory: egui
        env:
          public_url: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: egui/dist
          # Do not maintain a history of previous deployments.
          single-commit: true
